name: sync-attendance

on:
  schedule:
    # GitHub cron uses UTC. IST = UTC + 5:30. Runs may start a few minutes late.
    - cron: "30 3 * * *"    # 9:00 AM IST
    - cron: "30 5 * * *"    # 11:00 AM IST
    - cron: "0 8 * * *"     # 1:30 PM IST
    - cron: "30 11 * * *"   # 5:00 PM IST
    - cron: "30 15 * * *"   # 9:00 PM IST
    - cron: "30 17 * * *"   # 11:00 PM IST
  workflow_dispatch:         # run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-attendance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - run: python fetch_attendance.py
      - name: Commit
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add attendance.json
          git diff --cached --quiet && exit 0
          git commit -m "update attendance"
          git pull --rebase -X theirs
          git push
