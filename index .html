<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Attendance">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>Attendance</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #14161a; --muted: #6b7280; --line: #e5e7eb;
    --good: #16a34a; --warn: #d97706; --bad: #dc2626; --track: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #f3f4f6; --muted: #9ca3af; --line: #272b33;
      --good: #4ade80; --warn: #fbbf24; --bad: #f87171; --track: #2a2f38;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    max-width: 640px; margin: 0 auto;
  }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.3px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  button {
    appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 9px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .overall { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .big { font-size: 40px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .label { color: var(--muted); font-size: 13px; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .name { font-weight: 700; font-size: 16px; }
  .code { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .pct { font-weight: 800; font-size: 20px; white-space: nowrap; }
  .bar { position: relative; height: 8px; background: var(--track); border-radius: 99px; margin: 10px 0 8px; overflow: visible; }
  .fill { height: 100%; border-radius: 99px; }
  .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); opacity: .7; border-radius: 2px; }
  .meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
  .tip { font-size: 13px; margin-top: 6px; }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .fill.good { background: var(--good); } .fill.warn { background: var(--warn); } .fill.bad { background: var(--bad); }
  .notice { font-size: 13px; color: var(--muted); text-align: center; margin: 14px 0 4px; }
  .banner { background: color-mix(in srgb, var(--warn) 16%, var(--card)); border-color: var(--warn); color: var(--text); font-size: 14px; }
  .err { background: color-mix(in srgb, var(--bad) 14%, var(--card)); border-color: var(--bad); font-size: 14px; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  .lec { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .lec:last-child { border-bottom: 0; }
  .cap { text-transform: capitalize; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Attendance</h1>
    <div class="sub" id="sub">&nbsp;</div>
  </div>
  <button id="refresh" type="button">Refresh</button>
</header>
<main id="app"><div class="card">Loading…</div></main>

<script>
  // Where the data comes from. The sync job commits attendance.json to this repo every ~2 hours.
  const RAW_URL = "https://raw.githubusercontent.com/Aarkin-Sahu/attendance-sync/main/attendance.json";
  const LOCAL_URL = "attendance.json";   // fallback: same folder as this page
  const TARGET = 75;                     // required attendance %
  const SAFE_MARGIN = 5;                 // within this many % of the target shows amber
  const STALE_HOURS = 5;                 // warn if data is older than this

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => (Math.round(n * 10) / 10).toString();

  // How many more classes can be missed while staying >= TARGET (0 if none).
  function canSkip(a, t) { return Math.max(0, Math.floor((a * 100 / TARGET) - t + 1e-9)); }
  // How many classes in a row must be attended to reach TARGET.
  function needToAttend(a, t) {
    const r = TARGET / 100;
    return Math.max(0, Math.ceil((r * t - a) / (1 - r) - 1e-9));
  }
  function level(p) { return p < TARGET ? "bad" : p < TARGET + SAFE_MARGIN ? "warn" : "good"; }

  function agoText(date) {
    const mins = Math.max(0, Math.round((Date.now() - date.getTime()) / 60000));
    if (mins < 1) return "just now";
    if (mins < 60) return mins + " min ago";
    const h = Math.floor(mins / 60);
    if (h < 24) return h + " h " + (mins % 60) + " min ago";
    return Math.floor(h / 24) + " d ago";
  }

  function collectRows(data) {
    const rows = [];
    for (const course of data.attendanceCourseComponentInfoList || []) {
      for (const k of course.attendanceCourseComponentNameInfoList || []) {
        const t = Number(k.numberOfPeriods) || 0;
        const a = Number(k.numberOfPresent) || 0;
        rows.push({ name: course.courseName, code: course.courseCode, comp: k.componentName, lectures: k.lectures || [], a, t, p: t > 0 ? (a / t) * 100 : null });
      }
    }
    // Lowest attendance first; subjects with no classes yet go last.
    rows.sort((x, y) => (x.p === null) - (y.p === null) || (x.p ?? 0) - (y.p ?? 0));
    return rows;
  }

  const isAbsent = (l) => String(l.status).toUpperCase() === "ABSENT";
  function chip(st) {
    const x = String(st || "").toUpperCase();
    const c = x === "PRESENT" ? "good" : x === "ABSENT" ? "bad" : "warn";
    return `<span class="chip ${c}">${esc(x || "UNKNOWN")}</span>`;
  }
  function dmy(d) { if (!d) return "-"; const [y, m, dd] = d.split("-"); return dd + "/" + m + "/" + y; }
  function lectureRow(l, label) {
    return `<div class="lec"><div><div class="cap">${esc(dmy(l.date))} · ${esc(String(l.day || "").toLowerCase())}</div>
      <div class="code">${label ? esc(label) + " · " : ""}${esc(l.time)} · ${esc(l.type)}</div></div>${chip(l.status)}</div>`;
  }
  function lecturesHtml(ls) {
    if (!ls || !ls.length) return "";
    return `<details><summary>Lectures (${ls.length}) · ${ls.filter(isAbsent).length} absent</summary>${ls.map((l) => lectureRow(l)).join("")}</details>`;
  }
  // "10:50 AM - 11:40 AM" -> minutes since midnight of the start time (unknown times go last).
  function startMins(t) {
    const m = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(t || "");
    if (!m) return 9999;
    return ((Number(m[1]) % 12) + (m[3].toUpperCase() === "PM" ? 12 : 0)) * 60 + Number(m[2]);
  }
  function todayHtml(rows) {
    const today = new Date().toLocaleDateString("en-CA");   // YYYY-MM-DD, local time
    const items = [];
    rows.forEach((r) => r.lectures.forEach((l) => { if (l.date === today) items.push([l, r.name]); }));
    if (!items.length) return "";
    items.sort((x, y) => startMins(x[0].time) - startMins(y[0].time));   // earliest class first
    return `<div class="card"><div class="name" style="margin-bottom:4px">Today</div>${items.map(([l, n]) => lectureRow(l, n)).join("")}</div>`;
  }

  function render(json) {
    const data = json.data || {};
    const rows = collectRows(data);
    const counted = rows.filter((r) => r.t > 0);
    const A = counted.reduce((s, r) => s + r.a, 0);
    const T = counted.reduce((s, r) => s + r.t, 0);
    const overall = T > 0 ? (A / T) * 100 : null;

    document.getElementById("sub").textContent =
      [data.semesterName && "Semester " + data.semesterName, data.branchShortName, data.sectionName && "Section " + data.sectionName]
        .filter(Boolean).join(" · ") || " ";

    const updated = json.last_updated ? new Date(json.last_updated) : null;
    const stale = updated && (Date.now() - updated.getTime()) / 3600000 > STALE_HOURS;
    let html = "";

    if (stale) {
      html += `<div class="card banner">The data is ${esc(agoText(updated))}. The sync may be delayed or failing; check the Actions tab on GitHub.</div>`;
    }

    if (overall !== null) {
      const lv = level(overall);
      html += `<div class="card overall">
        <div><div class="label">Overall</div><div class="big ${lv}">${fmt(overall)}%</div></div>
        <div style="text-align:right"><div class="label">Classes attended</div><div style="font-size:22px;font-weight:700">${fmt(A)} / ${fmt(T)}</div></div>
      </div>`;
    }

    html += todayHtml(rows);

    for (const r of rows) {
      if (r.p === null) {
        html += `<div class="card"><div class="row-top"><div><div class="name">${esc(r.name)}</div><div class="code">${esc(r.code)} · ${esc(r.comp)}</div></div><div class="label">No classes yet</div></div></div>`;
        continue;
      }
      const lv = level(r.p);
      const tip = r.p >= TARGET
        ? (canSkip(r.a, r.t) > 0
            ? `<span class="good">You can miss ${canSkip(r.a, r.t)} more class${canSkip(r.a, r.t) === 1 ? "" : "es"} and stay at ${TARGET}%.</span>`
            : `<span class="warn">Right at the limit: don't miss the next class.</span>`)
        : `<span class="bad">Attend the next ${needToAttend(r.a, r.t)} class${needToAttend(r.a, r.t) === 1 ? "" : "es"} in a row to reach ${TARGET}%.</span>`;
      html += `<div class="card">
        <div class="row-top">
          <div><div class="name">${esc(r.name)}</div><div class="code">${esc(r.code)} · ${esc(r.comp)}</div></div>
          <div class="pct ${lv}">${fmt(r.p)}%</div>
        </div>
        <div class="bar"><div class="fill ${lv}" style="width:${Math.min(100, r.p)}%"></div><div class="mark" style="left:${TARGET}%"></div></div>
        <div class="meta"><span>${fmt(r.a)} of ${fmt(r.t)} classes</span><span>target ${TARGET}%</span></div>
        <div class="tip">${tip}</div>${lecturesHtml(r.lectures)}
      </div>`;
    }

    if (updated) {
      html += `<div class="notice">Updated ${esc(agoText(updated))} · ${esc(updated.toLocaleString([], { dateStyle: "medium", timeStyle: "short" }))}</div>`;
    }
    document.getElementById("app").innerHTML = html || `<div class="card">No attendance data found.</div>`;
  }

  function showError(err) {
    document.getElementById("app").innerHTML =
      `<div class="card err"><b>Couldn't load attendance.</b><br>${esc(err && err.message ? err.message : err)}<br><br>
      Check that the repo is public and that attendance.json exists, then tap Refresh.</div>`;
  }

  async function load() {
    const btn = document.getElementById("refresh");
    btn.disabled = true; btn.textContent = "Loading…";
    let json = null, lastErr = null;
    for (const url of [RAW_URL, LOCAL_URL]) {
      try {
        const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status + " from " + new URL(url, location.href).host);
        json = await res.json();
        break;
      } catch (e) { lastErr = e; }
    }
    if (json) render(json); else showError(lastErr);
    btn.disabled = false; btn.textContent = "Refresh";
  }

  document.getElementById("refresh").addEventListener("click", load);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
  load();
</script>
</body>
</html>
